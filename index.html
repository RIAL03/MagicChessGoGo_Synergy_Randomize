<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Chess Synergy Randomizer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c20, #15102a, #060214);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(255, 255, 255, 0.05);
            text-align: center;
            width: 90%;
            max-width: 450px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #ff7b00, #ffae00, #00e1ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 123, 0, 0.2);
        }

        .display-area {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .card {
            background: rgba(0, 0, 0, 0.4);
            padding: 1.2rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .card.active {
            border-color: #ffae00;
            box-shadow: 0 0 15px rgba(255, 174, 0, 0.2);
        }

        .label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 0.5rem;
        }

        .value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #f0f0f0;
            min-height: 2rem;
        }

        .value.highlight-1 {
            color: #ff7b00;
        }

        .value.highlight-2 {
            color: #00e1ff;
        }

        button {
            background: linear-gradient(45deg, #ff7b00, #ffae00);
            color: #000;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 123, 0, 0.4);
            transition: all 0.2s ease;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 123, 0, 0.6);
            background: linear-gradient(45deg, #ffae00, #ffcb6b);
        }

        button:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Synergy Randomizer</h1>
        
        <div class="display-area">
            <div class="card" id="synergy1Card">
                <div class="label">Sinergi</div>
                <div class="value highlight-1" id="synergy1Result">?</div>
            </div>
            
            <div class="card" id="synergy2Card">
                <div class="label">Sinergi</div>
                <div class="value highlight-2" id="synergy2Result">?</div>
            </div>
        </div>

        <button onclick="rollSynergy()">Acak Sinergi</button>
    </div>

    <script>
        // Data faction dan role digabungkan
        const allSynergies = [
            "Emberlord", "Astro Power", "Heartbound", "Dragoncaller", 
            "Exorcist", "Neobeast", "Enchanted Tales", "Mystic Meow", 
            "Northernvale", "Bruiser", "Defender", "Dauntless", 
            "Weapon Master", "Marksman", "Stargazer", "Swiftblade", 
            "Mage", "Phaseswaper", "Scavenger"
        ];

        // Fungsi untuk mendapatkan 2 index berbeda
        function getTwoDistinctIndices(max) {
            let index1 = Math.floor(Math.random() * max);
            let index2;
            do {
                index2 = Math.floor(Math.random() * max);
            } while (index1 === index2);
            return [index1, index2];
        }

        function rollSynergy() {
            const synergy1Result = document.getElementById('synergy1Result');
            const synergy2Result = document.getElementById('synergy2Result');
            const synergy1Card = document.getElementById('synergy1Card');
            const synergy2Card = document.getElementById('synergy2Card');

            // Efek visual acak cepat (gacha effect) sebelum berhenti
            let counter = 0;
            const interval = setInterval(() => {
                const tempIndices = getTwoDistinctIndices(allSynergies.length);
                
                synergy1Result.innerText = allSynergies[tempIndices[0]];
                synergy2Result.innerText = allSynergies[tempIndices[1]];
                counter++;

                if (counter > 10) {
                    clearInterval(interval);
                    
                    // Hasil Akhir yang Sebenarnya (dipastikan 2 sinergi berbeda)
                    const finalIndices = getTwoDistinctIndices(allSynergies.length);

                    synergy1Result.innerText = allSynergies[finalIndices[0]];
                    synergy2Result.innerText = allSynergies[finalIndices[1]];

                    // Tambah efek aktif sementara waktu
                    synergy1Card.classList.add('active');
                    synergy2Card.classList.add('active');

                    setTimeout(() => {
                        synergy1Card.classList.remove('active');
                        synergy2Card.classList.remove('active');
                    }, 500);
                }
            }, 50);
        }
    </script>
</body>
</html>
